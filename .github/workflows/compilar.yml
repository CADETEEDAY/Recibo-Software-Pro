class SecurityHelper:
    @staticmethod
    def gerar_hash(senha: str):
        salt = secrets.token_hex(16)
        senha_hash = hashlib.pbkdf2_hmac("sha256", senha.encode("utf-8"), salt.encode("utf-8"), 100000).hex()
        return senha_hash, salt

    @staticmethod
    def verificar_senha(senha: str, hash_salvo: str, salt: str):
        teste_hash = hashlib.pbkdf2_hmac("sha256", senha.encode("utf-8"), salt.encode("utf-8"), 100000).hex()
        return secrets.compare_digest(hash_salvo, teste_hash)

class DatabaseManager:
    def __init__(self, db_name="recibo_software.db"):
        self.db_path = db_name
        self._init_db()

    def get_connection(self):
        conn = sqlite3.connect(self.db_path)
        conn.row_factory = sqlite3.Row
        return conn

    def _init_db(self):
        with self.get_connection() as conn:
            c = conn.cursor()
            c.execute("PRAGMA journal_mode=WAL;")
            c.execute("CREATE TABLE IF NOT EXISTS usuarios (id INTEGER PRIMARY KEY AUTOINCREMENT, usuario TEXT UNIQUE, senha_hash TEXT, salt TEXT, nome_completo TEXT, perfil TEXT, criado_em DATETIME DEFAULT CURRENT_TIMESTAMP)")
            c.execute("CREATE TABLE IF NOT EXISTS recibos (id INTEGER PRIMARY KEY AUTOINCREMENT, tipo TEXT, numero TEXT, cliente_nome TEXT, cliente_doc TEXT, referente TEXT, data_recibo TEXT, valor REAL, emitente_nome TEXT, emitente_doc TEXT, emitente_cidade TEXT, criado_em DATETIME DEFAULT CURRENT_TIMESTAMP)")
            c.execute("CREATE TABLE IF NOT EXISTS clientes (id INTEGER PRIMARY KEY AUTOINCREMENT, nome TEXT, tipo_pessoa TEXT, cpf TEXT, cnpj TEXT, email TEXT, data_nasc TEXT, tel1 TEXT, tel2 TEXT, endereco TEXT, bairro TEXT, cidade TEXT, estado TEXT, cep TEXT, obs TEXT, status TEXT DEFAULT 'ATIVO', criado_em DATETIME DEFAULT CURRENT_TIMESTAMP)")
            c.execute("CREATE TABLE IF NOT EXISTS configuracoes (chave TEXT PRIMARY KEY, valor TEXT)")
            if c.execute("SELECT COUNT(id) FROM usuarios").fetchone()[0] == 0:
                h, s = SecurityHelper.gerar_hash("admin123")
                c.execute("INSERT INTO usuarios (usuario, senha_hash, salt, nome_completo, perfil) VALUES (?, ?, ?, ?, ?)", ("admin", h, s, "Administrador Geral", "ADMIN"))
            conn.commit()

    def autenticar(self, usuario, senha):
        with self.get_connection() as conn:
            user = conn.execute("SELECT * FROM usuarios WHERE usuario = ?", (usuario.strip(),)).fetchone()
            if user and SecurityHelper.verificar_senha(senha, user["senha_hash"], user["salt"]):
                return dict(user)
        return None

    def get_proximo_numero_recibo(self):
        with self.get_connection() as conn:
            row = conn.execute("SELECT COUNT(id) AS total FROM recibos").fetchone()
            return str((row["total"] if row else 0) + 1)

    def total_clientes(self):
        with self.get_connection() as conn:
            row = conn.execute("SELECT COUNT(id) as total FROM clientes").fetchone()
            return row["total"] if row else 0

    def ultimos_recibos(self, limite=3):
        with self.get_connection() as conn:
            return conn.execute("SELECT * FROM recibos ORDER BY id DESC LIMIT ?", (limite,)).fetchall()

    def set_config(self, chave, valor):
        with self.get_connection() as conn:
            conn.execute("INSERT OR REPLACE INTO configuracoes (chave, valor) VALUES (?, ?)", (chave, valor))
            conn.commit()

    def get_config(self, chave, default=""):
        with self.get_connection() as conn:
            row = conn.execute("SELECT valor FROM configuracoes WHERE chave = ?", (chave,)).fetchone()
            return row["valor"] if row else default

def valor_por_extenso(valor: float):
    inteiro = int(valor)
    centavos = int(round((valor - inteiro) * 100))
    return f"{inteiro} Reais e {centavos} Centavos."

