name: Compilar Recibo Software Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Obter Codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Converter Codificacao para UTF-8 Puro
      run: |
        python -c "
        for enc in ['utf-8-sig', 'utf-16', 'utf-16-le', 'utf-16-be', 'cp1252', 'latin-1']:
            try:
                with open('main.py', 'r', encoding=enc) as f:
                    content = f.read()
                with open('main.py', 'w', encoding='utf-8') as f:
                    f.write(content)
                print(f'Convertido com sucesso usando {enc}')
                break
            except Exception:
                pass
        "

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pillow pyinstaller

    - name: Gerar Executavel com PyInstaller
      run: |
        pyinstaller --clean --noconsole --onefile --collect-all customtkinter --name="ReciboSoftware" main.py

    - name: Publicar Executavel
      uses: actions/upload-artifact@v4
      with:
        name: ReciboSoftware-Windows
        path: dist/ReciboSoftware.exe
